<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="dist/css/main.css">
</head>
<body>
  <header class="header">
    <div class="header__inner container">
      <h1 class="header__title">Список задач</h1>

      <button type="button" class="button theme-switcher js-theme-toggle" aria-pressed="false">
        <svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
        </svg>
        <span>Тёмная тема</span>
      </button>
    </div>
  </header>

  <main class="main container">
    <div class="toolbar">
      <div class="search">
        <label for="search-input" class="visually-hidden">Поиск задач</label>
        <input type="search" id="search-input" class="search__input js-search" placeholder="Поиск по названию" autocomplete="off">
      </div>

      <button type="button" class="button button--primary js-add-button">
        <svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>Добавить задачу</span>
      </button>
    </div>

    <ul class="task-list js-task-list"></ul>
  </main>

  <!-- Модальное окно для добавления и редактирования -->
  <dialog class="modal js-modal" aria-labelledby="modal-title">
    <form class="js-modal-form" method="dialog">
      <h2 id="modal-title" class="modal__title js-modal-title">Новая задача</h2>

      <label for="modal-input" class="modal__label">Название задачи</label>
      <input type="text" id="modal-input" class="modal__input js-modal-input" required autofocus autocomplete="off">

      <div class="modal__actions">
        <button type="submit" class="button button--primary">Сохранить</button>
        <button type="button" class="button js-modal-cancel">Отмена</button>
      </div>
    </form>
  </dialog>

  <!-- Шаблон одной задачи -->
  <template class="js-task-template">
    <li class="task">
      <input type="checkbox" class="task__checkbox js-task-checkbox">
      <label class="task__title js-task-title"></label>

      <div class="task__actions">
        <button type="button" class="button button--icon js-edit-button">
          <svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-4-4L4 16v4z"/>
            <path d="M13.5 6.5l4 4"/>
          </svg>
          <span class="visually-hidden js-edit-text">Редактировать</span>
        </button>

        <button type="button" class="button button--icon button--danger js-delete-button">
          <svg class="button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M4 7h16"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12"/>
            <path d="M9 7V4h6v3"/>
          </svg>
          <span class="visually-hidden js-delete-text">Удалить</span>
        </button>
      </div>
    </li>
  </template>

  <script src="js/main.js"></script>
</body>
</html>
